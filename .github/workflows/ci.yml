# GitHub Actions CI/CD Pipeline
#
# Notes on why this changed from the previous version:
#   * It ran `yarn install --frozen-lockfile` and `cache: 'yarn'`, but this repo
#     has no yarn.lock anywhere — dependencies are managed by npm workspaces
#     (root package-lock.json). setup-node cannot produce a cache key without a
#     yarn.lock, so the dependency step could not succeed as written.
#   * It pinned Node 20, which reached end-of-life on 2026-04-30. The packages
#     declare engines node>=24, so the test runtime was also below what the code
#     requires.
#   * It called `next lint`, a command Next.js 16 removed.
#   * Image builds used `context: ./be` / `./fe`, which cannot see the root
#     lockfile, so the images were built from unpinned `npm install` results.

name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The schema files are the one part of this repo with no test coverage at all
    # (be/ and fe/ contain zero test files), so CI stands up the production major
    # version of Postgres and applies them the way a fresh install would.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atp_ci
          POSTGRES_PASSWORD: atp_ci
          POSTGRES_DB: allthepreaching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp_ci -d allthepreaching"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes, so the runner should not keep a writable token on disk.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace be

      - name: Production install sanity check
        # Mirrors be/Dockerfile: the shipped image installs with --omit=dev,
        # so anything the server needs at runtime must survive that.
        run: |
          npm ci --omit=dev --ignore-scripts --workspace be
          node --check be/server.js

      - name: Apply schema migrations to a fresh database
        env:
          DB_CLIENT: postgres
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: atp_ci
          PGPASSWORD: atp_ci
          PGDATABASE: allthepreaching
        run: |
          npm run db:migrate
          # Exits non-zero if anything is still pending.
          npm run db:migrate:status
          # A CONCURRENTLY build that fails leaves an INVALID index behind, which the
          # runner never reports and which the planner silently refuses to use. Check
          # it directly rather than trusting the exit status above.
          node -e '
            const { Client } = require("pg");
            const c = new Client({
              host: process.env.PGHOST, port: process.env.PGPORT,
              user: process.env.PGUSER, password: process.env.PGPASSWORD,
              database: process.env.PGDATABASE,
            });
            c.connect().then(() => c.query(`
              select c.relname from pg_index i join pg_class c on c.oid = i.indexrelid
              where not i.indisvalid`))
              .then((r) => r.rows.length
                ? Promise.reject(new Error("INVALID indexes: " + r.rows.map((x) => x.relname).join(", ")))
                : console.log("0 invalid indexes"))
              .then(() => c.end(), (e) => c.end().then(() => { throw e }));
          '
        working-directory: be

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p fe/tsconfig.json

      - name: Lint
        # Non-blocking on purpose: the linter has never actually run on this
        # tree (there was no ESLint config), so it reports pre-existing issues
        # rather than regressions. Flip continue-on-error to false once the
        # backlog is cleared.
        continue-on-error: true
        run: npm run lint --workspace fe

      - name: Run tests
        run: npm run test --workspace fe

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build --workspace fe

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: be/Dockerfile
          push: false
          tags: atp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fe/Dockerfile
          push: false
          tags: atp-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.allthepreaching.com
            NEXT_PUBLIC_SITE_URL=https://allthepreaching.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

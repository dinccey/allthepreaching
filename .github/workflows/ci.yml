# GitHub Actions CI/CD Pipeline
#
# Notes on why this changed from the previous version:
#   * It ran `yarn install --frozen-lockfile` and `cache: 'yarn'`, but this repo
#     has no yarn.lock anywhere — dependencies are managed by npm workspaces
#     (root package-lock.json). setup-node cannot produce a cache key without a
#     yarn.lock, so the dependency step could not succeed as written.
#   * It pinned Node 20, which reached end-of-life on 2026-04-30. The packages
#     declare engines node>=24, so the test runtime was also below what the code
#     requires.
#   * It called `next lint`, a command Next.js 16 removed.
#   * Image builds used `context: ./be` / `./fe`, which cannot see the root
#     lockfile, so the images were built from unpinned `npm install` results.

name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes, so the runner should not keep a writable token on disk.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace be

      - name: Production install sanity check
        # Mirrors be/Dockerfile: the shipped image installs with --omit=dev,
        # so anything the server needs at runtime must survive that.
        run: |
          npm ci --omit=dev --ignore-scripts --workspace be
          node --check be/server.js

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p fe/tsconfig.json

      - name: Lint
        # Non-blocking on purpose: the linter has never actually run on this
        # tree (there was no ESLint config), so it reports pre-existing issues
        # rather than regressions. Flip continue-on-error to false once the
        # backlog is cleared.
        continue-on-error: true
        run: npm run lint --workspace fe

      - name: Run tests
        run: npm run test --workspace fe

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build --workspace fe

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: be/Dockerfile
          push: false
          tags: atp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fe/Dockerfile
          push: false
          tags: atp-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.allthepreaching.com
            NEXT_PUBLIC_SITE_URL=https://allthepreaching.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
